# MeshRelay uses H2 by default so a reviewer can run the prototype without installing a database.
spring.application.name=meshrelay
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:mem:meshrelay;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
info.app.name=MeshRelay
info.app.description=Offline payment mesh simulator; not a real UPI/banking integration
logging.level.io.meshrelay.prototype=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
upi.mesh.idempotency-ttl-seconds=86400
upi.mesh.packet-max-age-seconds=86400
upi.mesh.clock-skew-seconds=300
