# Activate with --spring.profiles.active=postgres or SPRING_PROFILES_ACTIVE=postgres.
# Credentials are supplied through environment variables; never commit real credentials.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/meshrelay}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:meshrelay}
spring.datasource.password=${DB_PASSWORD:meshrelay}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.h2.console.enabled=false
